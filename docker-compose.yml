# Base de données locale pour le développement : docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bozochat
      POSTGRES_PASSWORD: bozochat
      POSTGRES_DB: bozochat
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
