name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bozochat
          POSTGRES_PASSWORD: bozochat
          POSTGRES_DB: bozochat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bozochat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bozochat:bozochat@localhost:5432/bozochat_test
      APP_ORIGIN: http://localhost:5173
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Build shared
        run: pnpm --filter @bozochat/shared build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrations à jour avec le schéma
        working-directory: apps/api
        run: |
          pnpm db:generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Le schéma Drizzle a changé sans migration. Lancez 'pnpm --filter api db:generate' et commitez le dossier drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Build de l'image Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Déploiement production (Coolify)
    needs: [quality, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Déclencher le déploiement Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::Secrets COOLIFY_WEBHOOK et/ou COOLIFY_TOKEN manquants (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail-with-body -sS -X GET "$COOLIFY_WEBHOOK" -H "Authorization: Bearer $COOLIFY_TOKEN"

      - name: Vérifier la production
        if: vars.PRODUCTION_URL != ''
        run: |
          # Laisse le temps à Coolify de construire et basculer (jusqu'à ~6 min)
          for i in $(seq 1 36); do
            sleep 10
            if curl -fsS "${{ vars.PRODUCTION_URL }}/api/health"; then echo; echo "Production OK"; exit 0; fi
          done
          echo "::warning::Healthcheck non concluant — consulter les logs de déploiement dans Coolify."
